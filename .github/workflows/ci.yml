name: CI

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path backend/Cargo.toml --all --check
      - run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path backend/Cargo.toml --all-targets
      - run: cargo run --locked --quiet --manifest-path backend/Cargo.toml --bin lattice-estimator-schema -- --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend check
      - run: pnpm --dir frontend build

  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t lattice-estimator-web:dev .
      - name: Smoke test runtime image
        shell: bash
        run: |
          docker network create lattice-estimator-ci
          docker run -d --name lattice-estimator-api-mock \
            --network lattice-estimator-ci \
            -v "$PWD/.github/fixtures/estimator-api:/www:ro" \
            busybox:1.37.0 httpd -f -p 8000 -h /www
          docker run -d --name lattice-estimator-web \
            --network lattice-estimator-ci \
            -p 127.0.0.1:8080:8080 \
            -e LATTICE_ESTIMATOR_API_URL=http://lattice-estimator-api-mock:8000/ \
            lattice-estimator-web:dev
          trap 'docker logs lattice-estimator-web; docker rm -f lattice-estimator-web lattice-estimator-api-mock; docker network rm lattice-estimator-ci' EXIT
          for _ in {1..30}; do
            curl --fail --silent --show-error http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          exit 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the release commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Determine whether this is the newest stable release
        id: release
        shell: bash
        run: |
          update_latest=false
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            while IFS= read -r tag; do
              [[ "$tag" == *-* ]] && continue
              [[ "$GITHUB_REF_NAME" == "$tag" ]] && update_latest=true
              break
            done < <(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname)
          fi
          echo "update_latest=$update_latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.update_latest == 'true' }}
            type=sha,format=long
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify latest points to this stable release
        if: steps.release.outputs.update_latest == 'true'
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' \
            | jq --exit-status --arg digest "$EXPECTED_DIGEST" '.digest == $digest'
