name: lattice-estimator-local

# Local source-build stack. Both images are built from the sibling repositories
# and are independent of the published GHCR images used by compose.yaml.
services:
  estimator-api:
    image: lattice-estimator-api:local
    build:
      context: ../lattice-estimator-api
      target: runtime
    platform: linux/amd64
    environment:
      LATTICE_ESTIMATOR_API_CONCURRENCY: "${LATTICE_ESTIMATOR_API_CONCURRENCY:-3}"
    restart: unless-stopped

  estimator-web:
    image: lattice-estimator-web:local
    build:
      context: .
      target: runtime
    platform: linux/amd64
    depends_on:
      estimator-api:
        condition: service_healthy
    environment:
      LATTICE_ESTIMATOR_API_URL: http://estimator-api:8000/
      LATTICE_ESTIMATOR_WEB_API_TOKEN: "${LATTICE_ESTIMATOR_WEB_API_TOKEN:-}"
      LATTICE_ESTIMATOR_WEB_CASE_CONCURRENCY: "${LATTICE_ESTIMATOR_WEB_CASE_CONCURRENCY:-2}"
      LATTICE_ESTIMATOR_WEB_ESTIMATOR_CONCURRENCY: "${LATTICE_ESTIMATOR_WEB_ESTIMATOR_CONCURRENCY:-3}"
    ports:
      - "${LATTICE_ESTIMATOR_LOCAL_HOST:-127.0.0.1}:${LATTICE_ESTIMATOR_LOCAL_PORT:-8081}:8080"
    volumes:
      - lattice-estimator-web-local-data:/var/lib/lattice-estimator-web
    restart: unless-stopped

volumes:
  lattice-estimator-web-local-data:
